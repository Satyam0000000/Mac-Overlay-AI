<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Private Overlay</title>
<style>
    /* Force absolute transparency for the window viewport and body */
    html, body, main {
      background: transparent !important;
      background-color: transparent !important;
    }
    
    body { 
      margin: 0; 
      color: #000; 
      font: 14px -apple-system, BlinkMacSystemFont, sans-serif; 
    }
    
    #app { 
      height: 100vh; 
      display: flex; 
      flex-direction: column; 
      overflow: hidden; 
      border: none !important; 
      outline: none !important;
      border-radius: 16px; 
      box-shadow: none !important; 
      background: transparent !important; 
    }

    /* Removed all dark background and borders from containers */
    header, #chat, .composer, #settings {
      background: transparent !important;
      border: none !important;
      outline: none !important;
    }

    /* Fully transparent message bubbles with black text for visibility */
    .message { 
      max-width:88%; 
      padding:10px 12px; 
      white-space:pre-wrap; 
      line-height:1.4; 
      border-radius:12px; 
      background: transparent !important; 
      backdrop-filter: none; 
      border: none !important; 
      outline: none !important;
      box-shadow: none !important;
      color: #000; 
    } 
    .user { 
      align-self:flex-end; 
      background: transparent !important; 
      backdrop-filter: none; 
      border: none !important; 
      outline: none !important;
      box-shadow: none !important;
      color: #000; 
    }
    
    header { -webkit-app-region: drag !important; padding: 13px 16px; display:flex; justify-content:space-between; align-items:center; color:#000; font-size:12px; }
    .header-controls { -webkit-app-region: no-drag !important; display:flex; gap:6px; align-items:center; }
    header button { -webkit-app-region: no-drag !important; }
    button, input, textarea, select { font: inherit; } 
    
    /* Translucent glass buttons with no black borders and black readable text */
    button, select { 
      border: none !important; 
      outline: none !important;
      border-radius:9px; 
      background: transparent !important; 
      backdrop-filter: none; 
      color: #000; 
      padding:9px 12px; 
      cursor:pointer; 
    } 
    select option {
      background: #222;
      color: #fff;
    }
    button.secondary { background: transparent !important; color: #000; border: none !important; }
    button:focus, input:focus, textarea:focus, select:focus { outline: none !important; border: none !important; box-shadow: none !important; }
    
    #chat { padding: 14px; flex: 1; overflow-y: auto; display:flex; flex-direction:column; gap:10px; } 
    .composer { padding:12px; display:grid; gap:8px; border: none !important; } 
    
    /* Translucent text input and textarea fields with no black borders and black text */
    textarea, input, select { 
      width:100%; 
      background: transparent !important; 
      backdrop-filter: none; 
      border: none !important; 
      outline: none !important;
      border-radius:9px; 
      color: #000; 
      padding:10px; 
    } 
    textarea { resize:none; height:66px; }
    
    #chat, .composer, textarea, input, select { -webkit-app-region: no-drag !important; pointer-events: auto !important; }
    .actions { display:flex; gap:8px; align-items:center; } 
    #imageName { color: #000; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; } 
    #settings { padding:16px; display:none; gap:12px; flex:1; flex-direction:column; overflow:auto; background: rgba(240, 240, 245, 0.75); backdrop-filter: blur(16px); } 
    #settings.open { display:flex; } 
    #app.settings-open #chat, #app.settings-open .composer { display:none; } 
    .hint { color: #000; font-size:12px; line-height:1.4; } 
    .hidden { display:none; }
    
    input, textarea {
      -webkit-user-select: text !important;
      user-select: text !important;
      cursor: text !important;
    }

    .preview-container {
      display: none;
      gap: 8px;
      padding: 0 12px 4px 12px;
      overflow-x: auto;
    }
    .thumb-wrapper {
      position: relative;
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid rgba(128, 128, 128, 0.4);
    }
    .thumb-preview {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .thumb-delete-btn {
      position: absolute;
      top: 1px;
      right: 1px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 15px;
      height: 15px;
      font-size: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
    }
    .thumb-delete-btn:hover {
      background: rgba(255, 0, 0, 0.8);
    }
  </style>
</head>
<body>
  <main id="app">
    <header>
      <span>PRIVATE OVERLAY</span>
      <div class="header-controls">
        <button id="themeToggle" class="secondary" title="Switch text color black/white">color</button>
        <button id="settingsButton" class="secondary">Settings</button>
      </div>
    </header>
    <section id="chat" aria-live="polite"></section>
    <div id="imagePreviewContainer" class="preview-container"></div>
    <section class="composer">
      <input type="text" id="message" placeholder="Ask anything... (Enter to send)" autofocus />
      <div class="actions">
        <input id="image" class="hidden" type="file" accept="image/png,image/jpeg,image/webp,image/gif" />
        <button id="imageButton" class="secondary">Image</button>
        <button id="captureButton" class="secondary" title="Capture Window Screen"> Snap</button>
        <span id="imageName">No image</span>
        <button id="send">Send</button>
      </div>
    </section>
    <section id="settings">
      <strong>OpenAI API key</strong>
      <input id="apiKey" type="password" autocomplete="off" placeholder="sk-…" />
      <button id="saveKey">Save securely</button>
      <span id="status" class="hint"></span>
      <strong>Model Selection</strong>
      <select id="modelSelect">
        <option value="gpt-5.4" selected>gpt-5.4 (Default Reasoning)</option>
        <option value="o3">o3</option>
        <option value="o4-mini">o4-mini</option>
        <option value="gpt-5.1">gpt-5.1</option>
        <option value="o1">o1</option>
      </select>
      <p class="hint">Stored locally using macOS Keychain encryption. This overlay is not designed to hide from capture or screen-sharing software.</p>
    </section>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
